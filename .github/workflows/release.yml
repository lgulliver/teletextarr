name: release

# Push a tag like v0.2.0 to publish: tests, a multi-arch image on GHCR, then a GitHub Release.
on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: write
  packages: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.15"

      - name: Check the tag matches the package version
        run: |
          version=$(python -c "import teletextarr; print(teletextarr.__version__)")
          project=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          if [ "v$version" != "$GITHUB_REF_NAME" ] || [ "$version" != "$project" ]; then
            echo "Tag $GITHUB_REF_NAME, teletextarr.__version__ $version and pyproject.toml $project must all agree" >&2
            exit 1
          fi

      - run: pip install -r requirements.txt -r requirements-dev.txt
      - run: python -m pytest -q

      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest

      - uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      # Hand-written notes in .github/release-notes/<tag>.md go first when they exist;
      # GitHub's generated list of changes is always added underneath.
      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          notes=$(mktemp)
          if [ -f ".github/release-notes/$GITHUB_REF_NAME.md" ]; then
            cat ".github/release-notes/$GITHUB_REF_NAME.md" > "$notes"
          else
            echo "Docker image: \`ghcr.io/${{ github.repository }}:${GITHUB_REF_NAME#v}\`" > "$notes"
          fi
          gh release create "$GITHUB_REF_NAME" --verify-tag --title "Teletextarr $GITHUB_REF_NAME" \
            --generate-notes --notes-file "$notes"
